<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Bliss Yoga & Wellness</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #121412;
        color: #f4f1ea;
        font-family: 'Playfair Display', Georgia, serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 500px;
        padding: 40px 24px;
        background-color: #191c19;
        border: 1px solid rgba(197, 160, 89, 0.3);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      }
      h1 {
        color: #c5a059;
        font-size: 28px;
        margin-bottom: 12px;
      }
      p {
        font-family: system-ui, -apple-system, sans-serif;
        color: #94a388;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      button {
        background: linear-gradient(135deg, #c5a059, #d4af37);
        color: #121412;
        border: none;
        padding: 12px 28px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>BLISS YOGA</h1>
      <p>You are currently offline. Please check your internet connection to continue your online yoga practice or live Jitsi class.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
